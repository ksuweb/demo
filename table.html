<h2>Simple Table</h2>
<!-- this is a simple table -->
 <table border="1">
    <tr bgcolor="pink" height="50">
        <th width="200" align="left">Person</th>
        <th width="100">Height</th>
    </tr>
    <tr>
        <td>Alice Smith Jr.</td>
        <td align="center">5'4"</td>
    </tr>
    <tr>
        <td>Bob Johnson</td>
        <td align="center">6'1"</td>
    </tr>
</table>

<h2>Complex and Styled Table Example</h2>
<!-- this is a styled table -->
<table border="1" cellpadding="10" cellspacing="5">
    <tr bgcolor="pink" height="50" style="background-color: greenyellow; color: red; font-size: 30px;">
        <th width="200" align="left">Department</th>
        <th width="100" colspan="2">Person</th>
        <th width="200">Height</th>
    </tr>
    <tr>
        <td rowspan="2">IT</td>
        <td>Alice Smith Jr.</td>
        <td align="center">5'4"</td>
        <td></td>
    </tr>
    <tr>
        <td>Bob Johnson</td>
        <td align="center" colspan="2">6'1"</td>
    </tr>
    <tr style="border: 5px solid red;">
        <td>HR</td>
        <td>Charlie Brown</td>
        <td></td>
        <td align="center">5'9"</td>
    </tr>
</table>

    </body>
</html>
