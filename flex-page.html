<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Page</title>
    <style>
        header, nav, main, footer, section
        {
            border: 1px solid #eeeeee;
            padding: 10px;
            margin: 2px;
        }

        main{
            display: flex;
        }

        .mainSection {
            flex: 1;
        }
    </style>
</head>
<body>

<header>
    <h1>Flex Page</h1>
</header>

<nav>
    menu
</nav>

<main>
    <section class="left">left part</section>
    <section class="mainSection">main part


more examples: <a href="https://codepen.io/collection/kkrBaw" target="_blank">Codepen Collection for page layout using Flexbox</a>
        <h1>Main Section</h1>
        <p>This is the main content area where the primary information will be displayed.</p>
    </section>
    <section class="right">right part</section>
</main>

<footer>
    footer part
</footer>

</body>
</html>
