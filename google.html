    <body>
Google search
<form action="https://www.google.com/search" method="get" target="_blank">
        <input type="text" name="q" required>
        <input type="hidden" name="hl" value="en">
        <input type="radio" name="udm" value="1"> Text Search
        <input type="radio" name="udm" value="2"> Image Search
         <input type="submit" value="Search">
         <input type="reset" value="Reset">
    </form> 

<p></p>
<input type="text" name="q" id="inputText" required>
<input type="button" value="Search" onclick="searchGoogle()">
<script>
    function searchGoogle() {
        var query = document.getElementById("inputText").value;
        var url = "https://www.google.com/search?q="+ query;    
        if (query.trim() === "") {
            alert("Please enter a search query.");
            return;
        }
        window.open(url, "_blank");
    }
        </script>

    </body>
</html>
